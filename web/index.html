<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Academia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="estilo.css">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
</head>
<body>
<header class="barra">
  <button class="marca" data-ir="hoy" aria-label="Inicio"><span class="logo">🎓</span><span class="nombre-app">Academia</span></button>
  <div class="estado-ia" id="estadoIA" title="Qué está haciendo la IA (toca para ver la cola)" data-ir="cola" role="button"></div>
  <nav class="atajos" aria-label="Accesos y menús">
    <button data-ir="cola" title="Cola de la IA y recursos" aria-label="Cola de la IA">⏳</button>
    <button data-ir="objetivos" title="Objetivos y metas" aria-label="Objetivos">🎯</button>
    <button data-ir="acciones" title="Acciones bajo vigilancia" aria-label="Acciones">💹</button>
    <div class="menu-desp">
      <button type="button" class="menu-btn" data-menu="analisis" aria-expanded="false" aria-haspopup="true" title="Análisis y progreso">📊 <span class="etq-txt">Análisis</span> ▾</button>
      <div class="menu-panel" data-panel="analisis" hidden>
        <button data-ir="tablero">📊 Tablero y fechas</button>
        <button data-ir="progreso">📈 Cómo aprendes</button>
        <button data-ir="horizonte">🔭 Tu horizonte</button>
        <button data-ir="metricas">🔬 Qué sabe el sistema</button>
        <button data-ir="salud">🩺 Salud del sistema</button>
        <button data-ir="reporte">📄 Reporte y datos</button>
      </div>
    </div>
    <div class="menu-desp">
      <button type="button" class="menu-btn" data-menu="herramientas" aria-expanded="false" aria-haspopup="true" title="Herramientas de estudio">🧰 <span class="etq-txt">Más</span> ▾</button>
      <div class="menu-panel" data-panel="herramientas" hidden>
        <button data-ir="verificar">🔎 Verificar afirmación</button>
        <button data-ir="chequeo">🧪 Chequeo semanal</button>
        <button data-ir="pruebas">📝 Mis pruebas de nivel</button>
        <button data-ir="tareas">📋 Mis tareas de práctica</button>
      </div>
    </div>
    <button data-ir="ajustes" title="Ajustes" aria-label="Ajustes">⚙️</button>
  </nav>
</header>
<nav class="menu" id="menu">
  <button data-ir="hoy"><span>☀️</span><b>Hoy</b></button>
  <button data-ir="reto"><span>⚡</span><b>Reto</b></button>
  <button data-ir="ruta"><span>🗺️</span><b>Ruta</b></button>
  <button data-ir="repasar"><span>🔁</span><b>Repasar</b><i class="globo" id="globoRepaso" hidden></i></button>
  <button data-ir="cuaderno"><span>✍️</span><b>Cuaderno</b></button>
  <button data-ir="tutor"><span>💬</span><b>Tutor</b></button>
  <button data-ir="noticias"><span>🌍</span><b>Noticias</b></button>
</nav>
<main id="vista" tabindex="-1"></main>
<div class="modal" id="modal" hidden><div class="caja" id="modalCaja"></div></div>
<div class="aviso" id="aviso" hidden></div>
<script src="app.js"></script>
<script src="cuaderno.js"></script>
<script src="acciones.js"></script>
<script src="codigo.js"></script>
<script src="diferida.js"></script>
<script src="salud.js"></script>
<script src="metricas.js"></script>
<script src="eventos.js"></script>
<script src="nube.js"></script>
<script src="indice.js"></script>
</body>
</html>
