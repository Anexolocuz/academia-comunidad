# Al subir una etiqueta vX.Y.Z (la crea publicar.sh): imagen Docker en GHCR + versión en GitHub Releases.
name: Publicar versión
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen multi-arquitectura (PC y Raspberry Pi/Apple Silicon)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/anexolocuz/academia-comunidad:latest
            ghcr.io/anexolocuz/academia-comunidad:${{ github.ref_name }}
      - name: Notas de la versión (sección del CHANGELOG)
        run: |
          v=$(cat VERSION)
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
      - name: ZIP para descargar sin Git
        run: git archive --format=zip --prefix=academia/ -o academia-${{ github.ref_name }}.zip HEAD
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notas.md
          files: academia-${{ github.ref_name }}.zip
